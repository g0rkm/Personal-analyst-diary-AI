<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!--
        Uygulama arayüzü Windows'un "Segoe UI" fontunu ister.
        Linux konteynerinde bu font bulunmadığı için DejaVu Sans'a yönlendiriyoruz;
        aksi halde Qt rastgele bir yedek font seçer ve hizalamalar bozulur.
    -->
    <alias binding="strong">
        <family>Segoe UI</family>
        <accept><family>DejaVu Sans</family></accept>
    </alias>
    <alias binding="strong">
        <family>Inter</family>
        <accept><family>DejaVu Sans</family></accept>
    </alias>
</fontconfig>
